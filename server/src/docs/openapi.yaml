openapi: 3.0.3
info:
  title: Author Support Portal API
  version: 1.0.0
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: API healthy }
  /api/auth/login:
    post:
      summary: Login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: priya.sharma@email.com }
                password: { type: string, example: Author123@ }
      responses:
        "200": { description: JWT and user }
        "401": { description: Invalid credentials }
  /api/auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
  /api/books:
    get:
      summary: List books for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Books }
  /api/tickets:
    get:
      summary: List tickets
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Tickets }
    post:
      summary: Create ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                bookId: { type: string }
                subject: { type: string }
                description: { type: string }
                attachmentName: { type: string }
      responses:
        "201": { description: Created }
  /api/tickets/{id}:
    get:
      summary: Get ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Ticket }
  /api/tickets/{id}/replies:
    post:
      summary: Add public reply
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "201": { description: Reply created }
  /api/admin/tickets:
    get:
      summary: Admin ticket queue
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: All tickets }
  /api/admin/tickets/{id}:
    patch:
      summary: Update ticket, assignment, internal note, classification or AI draft
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                category: { type: string }
                priority: { type: string }
                assignToMe: { type: boolean }
                internalNote: { type: string }
                aiDraft: { type: string }
      responses:
        "200": { description: Updated }
  /api/admin/tickets/{id}/draft-response:
    post:
      summary: Generate AI response draft
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Draft response }
  /api/admin/tickets/{id}/send-response:
    post:
      summary: Send reviewed response to author
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "201": { description: Reply sent }
